<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="HiveMind">
  <defs>
    <!-- 绯红主色：中心透亮，边缘沉为深宝石红 -->
    <radialGradient id="hm-crimson" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#b0283a"/>
      <stop offset="52%" stop-color="#7c1522"/>
      <stop offset="100%" stop-color="#3c0810"/>
    </radialGradient>
    <!-- 琉璃黄强调色 -->
    <linearGradient id="hm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e7ac"/>
      <stop offset="44%" stop-color="#e4bc4d"/>
      <stop offset="100%" stop-color="#a97a1c"/>
    </linearGradient>
    <!-- 核心辉光 -->
    <radialGradient id="hm-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e2" stop-opacity="0.95"/>
      <stop offset="32%" stop-color="#f4d67c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8c45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底座：绯红光晕盘 -->
  <circle cx="60" cy="60" r="53" fill="url(#hm-crimson)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#hm-gold)" stroke-width="2.4" stroke-opacity="0.62"/>

  <!-- 协作网络：节点互联 -->
  <path d="M32 40 L91 53 L50 94 Z"
        fill="none" stroke="url(#hm-gold)" stroke-width="1.7" stroke-opacity="0.55" stroke-linejoin="round"/>

  <!-- 核心辐射：中枢直达各智能体 -->
  <g stroke="url(#hm-gold)" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="58" y1="60" x2="32" y2="40"/>
    <line x1="58" y1="60" x2="91" y2="53"/>
    <line x1="58" y1="60" x2="50" y2="94"/>
  </g>

  <!-- 卫星微粒 -->
  <g fill="url(#hm-gold)" opacity="0.8">
    <circle cx="86" cy="28" r="2.6"/>
    <circle cx="26" cy="74" r="2.2"/>
  </g>

  <!-- 各智能体节点 -->
  <g fill="url(#hm-gold)">
    <circle cx="32" cy="40" r="5.6"/>
    <circle cx="91" cy="53" r="4.6"/>
    <circle cx="50" cy="94" r="4"/>
  </g>

  <!-- 中枢：共享心智核心 -->
  <circle cx="58" cy="60" r="20" fill="url(#hm-core)">
    <animate attributeName="r" values="16;22;16" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="60" r="8" fill="url(#hm-gold)"/>
  <circle cx="58" cy="60" r="3.4" fill="#fff8e2"/>
</svg>
