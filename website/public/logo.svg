<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="HiveMind">
  <defs>
    <!-- 绯红主色 -->
    <linearGradient id="hm-crimson" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#c6303f"/>
      <stop offset="55%" stop-color="#a3222e"/>
      <stop offset="100%" stop-color="#7c1922"/>
    </linearGradient>
    <!-- 琉璃黄强调色 -->
    <linearGradient id="hm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d681"/>
      <stop offset="46%" stop-color="#dbb038"/>
      <stop offset="100%" stop-color="#a67d1e"/>
    </linearGradient>
    <!-- 核心辉光 -->
    <radialGradient id="hm-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6dc" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#e8c45c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8c45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 核心光晕：共享心智的辐射 -->
  <circle cx="60" cy="63" r="46" fill="url(#hm-core)">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ============================================================
       蜂巢簇：真实蜂巢的三上二下紧凑阵列
       平顶正六边形，R = 20，相邻巢房中心距 = 1.5R = 30
       ============================================================ -->

  <!-- 上排：左上 / 中上 / 右上 -->
  <g fill="url(#hm-crimson)" stroke="url(#hm-gold)" stroke-width="1.7" stroke-linejoin="round">
    <path d="M30 7 L50 18 L50 40 L30 51 L10 40 L10 18 Z"/>
    <path d="M60 7 L80 18 L80 40 L60 51 L40 40 L40 18 Z"/>
    <path d="M90 7 L110 18 L110 40 L90 51 L70 40 L70 18 Z"/>
    <!-- 下排：左下 / 右下 -->
    <path d="M45 45 L65 56 L65 78 L45 89 L25 78 L25 56 Z"/>
    <path d="M75 45 L95 56 L95 78 L75 89 L55 78 L55 56 Z"/>
  </g>

  <!-- 中心巢房：蜂巢之心（描边加粗 + 金色实心） -->
  <path d="M60 45 L80 56 L80 78 L60 89 L40 78 L40 56 Z"
        fill="url(#hm-crimson)" stroke="url(#hm-gold)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- 各巢房内的智能体节点 -->
  <g fill="#f0d074">
    <circle cx="30" cy="29" r="2.8" opacity="0.78"/>
    <circle cx="60" cy="29" r="2.8" opacity="0.64"/>
    <circle cx="90" cy="29" r="2.8" opacity="0.5"/>
    <circle cx="45" cy="67" r="2.8" opacity="0.78"/>
    <circle cx="75" cy="67" r="2.8" opacity="0.64"/>
  </g>

  <!-- 核心：多智能体共享的心智 -->
  <circle cx="60" cy="67" r="14" fill="url(#hm-core)">
    <animate attributeName="r" values="12;16;12" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="67" r="8" fill="url(#hm-gold)"/>
  <circle cx="60" cy="67" r="3.6" fill="#fff6dc"/>
</svg>
