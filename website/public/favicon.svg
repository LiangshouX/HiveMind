<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="f-crimson" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#b0283a"/>
      <stop offset="52%" stop-color="#7c1522"/>
      <stop offset="100%" stop-color="#3c0810"/>
    </radialGradient>
    <linearGradient id="f-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e7ac"/>
      <stop offset="44%" stop-color="#e4bc4d"/>
      <stop offset="100%" stop-color="#a97a1c"/>
    </linearGradient>
  </defs>

  <!-- 绯红光晕盘 -->
  <circle cx="32" cy="32" r="30" fill="url(#f-crimson)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#f-gold)" stroke-width="2.4" stroke-opacity="0.62"/>

  <!-- 协作网络 -->
  <path d="M15 19 L48 26 L25 51 Z" fill="none" stroke="url(#f-gold)" stroke-width="1.8" stroke-opacity="0.55" stroke-linejoin="round"/>

  <!-- 核心辐射 -->
  <g stroke="url(#f-gold)" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="31" y1="31" x2="15" y2="19"/>
    <line x1="31" y1="31" x2="48" y2="26"/>
    <line x1="31" y1="31" x2="25" y2="51"/>
  </g>

  <!-- 智能体节点 -->
  <g fill="url(#f-gold)">
    <circle cx="15" cy="19" r="5"/>
    <circle cx="48" cy="26" r="4.1"/>
    <circle cx="25" cy="51" r="3.5"/>
  </g>

  <!-- 中枢：共享心智核心 -->
  <circle cx="31" cy="31" r="7.4" fill="url(#f-gold)"/>
  <circle cx="31" cy="31" r="3.2" fill="#fff8e2"/>
</svg>
